name: 'Download Release Asset'

description: |-
  Download a github.com release asset to a file. On GitHub Enterprise Server,
  first look for the same asset on the same release of the current GitHub
  host and fall back to github.com if it is not there. This avoids github.com
  rate limits on shared-egress runners when the instance mirrors the release.

inputs:
  url:
    description: 'Release asset URL, e.g. https://github.com/<owner>/<repo>/releases/download/<tag>/<asset>. Other URLs are downloaded as-is.'
    required: true
  path:
    description: 'File to write. Parent directories are created.'
    required: true
  token:
    description: 'Token for the current GitHub host. Only sent to that host, never to github.com from GHES.'
    default: '${{ github.token }}'
    required: false
  mirror_lookup:
    description: 'Look for the asset on the current GitHub host first. Has no effect on github.com.'
    default: 'true'
    required: false
  server_url:
    description: 'GitHub host to look on. Defaults to the current host.'
    default: '${{ github.server_url }}'
    required: false
  api_url:
    description: 'API URL of `server_url`. Defaults to the current host.'
    default: '${{ github.api_url }}'
    required: false

outputs:
  source:
    description: '`ghes` if the asset came from the current GitHub host, otherwise `upstream`.'
    value: '${{ steps.download.outputs.source }}'
  url:
    description: 'The URL the asset was downloaded from.'
    value: '${{ steps.download.outputs.url }}'

runs:
  using: 'composite'
  steps:
    - name: 'Download'
      id: 'download'
      shell: 'bash'
      env:
        URL: '${{ inputs.url }}'
        DEST: '${{ inputs.path }}'
        TOKEN: '${{ inputs.token }}'
        MIRROR_LOOKUP: '${{ inputs.mirror_lookup }}'
        SERVER_URL: '${{ inputs.server_url }}'
        API_URL: '${{ inputs.api_url }}'
      run: |-
        set -euo pipefail

        if [[ -z "${URL}" || -z "${DEST}" ]]; then
          echo "::error ::url and path are required"
          exit 1
        fi

        SERVER_URL="${SERVER_URL%/}"
        API_URL="${API_URL%/}"
        mkdir -p "$(dirname "${DEST}")"

        finish() {
          echo "source=$1" >> "${GITHUB_OUTPUT}"
          echo "url=$2" >> "${GITHUB_OUTPUT}"
          echo "Downloaded ${DEST} from $2"
        }

        # GHES only accepts tokens on the API, not on /releases/download/
        # (which redirects to the login page), so resolve the asset through
        # GET /repos/{owner}/{repo}/releases/tags/{tag} and download it from
        # the asset API URL. curl drops the token on cross-host redirects.
        RE='^https://github\.com/([^/]+/[^/]+)/releases/download/([^/?]+)/([^/?]+)$'
        if [[ "${MIRROR_LOOKUP}" == "true" && "${SERVER_URL}" != "https://github.com" && "${URL}" =~ ${RE} ]]; then
          REPO="${BASH_REMATCH[1]}"
          TAG="${BASH_REMATCH[2]}"
          NAME="$(printf '%b' "${BASH_REMATCH[3]//%/\\x}")"
          MIRROR="${SERVER_URL}/${REPO}/releases/download/${TAG}/${NAME}"

          ASSET="$(curl -sSf --retry 2 -H "Authorization: token ${TOKEN}" \
              "${API_URL}/repos/${REPO}/releases/tags/${TAG}" 2>/dev/null | tr ',' '\n' |
            awk -v n="${NAME}" '
              match($0, /"url": *"[^"]*\/releases\/assets\/[0-9]+"/) { u = substr($0, RSTART, RLENGTH); sub(/^"url": *"/, "", u); sub(/"$/, "", u) }
              index($0, "\"name\": \"" n "\"") && u != "" { print u; exit }')" || true

          # Treat an HTML response (e.g. a login page) as a miss.
          if [[ -n "${ASSET}" ]] &&
            TYPE="$(curl -sSfL --retry 2 --max-time 300 -H "Authorization: token ${TOKEN}" \
              -H 'Accept: application/octet-stream' -o "${DEST}" -w '%{content_type}' "${ASSET}" 2>/dev/null)" &&
            [[ "${TYPE}" != text/html* && -s "${DEST}" ]]; then
            finish ghes "${MIRROR}"
            exit 0
          fi
          rm -f "${DEST}"
          echo "No copy of ${REPO} ${TAG} ${NAME} on ${SERVER_URL}; using ${URL}"
        fi

        # Only send the token upstream when it belongs to that host.
        AUTH=()
        if [[ "${SERVER_URL}" == "https://github.com" && -n "${TOKEN}" ]]; then
          AUTH=(-H "Authorization: token ${TOKEN}")
        fi
        curl -sSfL --retry 3 --retry-delay 5 --max-time 600 ${AUTH[@]+"${AUTH[@]}"} -o "${DEST}" "${URL}"
        finish upstream "${URL}"
